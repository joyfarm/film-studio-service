<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>영화대본 스튜디오</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding:wght@400;700&display=swap">
<style>[hidden]{display:none!important}img{max-width:100%}
/* K-Modern 디자인 시스템: Pretendard, 슬레이트 잉크, 코랄 포인트(#FF385C), 16px 카드, 알약형 탭·칩. 화면의 대부분은 흰 바탕과 회색 계열로 두고 포인트색은 아껴 쓴다. */
:root{
  --font-ui:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,Roboto,'Helvetica Neue','Segoe UI','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  --font-display:var(--font-ui);
  --font-script:'Nanum Gothic Coding','JetBrains Mono','D2Coding',ui-monospace,Menlo,Consolas,monospace;
  --bg:#FFFFFF; --surface:#F9FAFB; --paper:#FFFFFF; --hover:#F2F4F6;
  --ink:#191F28; --ink-2:#333D4B; --ink-3:#6B7684; --ink-4:#8B95A1;
  --line:#E5E8EB; --line-2:#F2F4F6; --line-strong:#D1D6DB;
  --accent:#FF385C; --accent-btn:#E01542; --accent-btn-hover:#C40D36; --accent-text:#C40D36; --accent-ink:#FFFFFF; --accent-soft:#FFF0F3;
  --tally:#F04452; --ok:#04784A; --ok-soft:#E6F7EF; --warn:#A35200; --warn-soft:#FFF4E5;
  --screen-bg:#111418; --screen-fg:#F9FAFB; --screen-dim:#8B95A1;
  --r-xs:6px; --r-sm:10px; --r-md:16px; --r-lg:24px;
  --sh-card:0 10px 24px -4px rgba(25,31,40,.08),0 2px 6px -1px rgba(25,31,40,.04);
  --sh-panel:0 6px 20px rgba(0,0,0,.08),0 0 0 1px #E5E8EB;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0F1217; --surface:#161A21; --paper:#1A1F27; --hover:#212732;
    --ink:#F2F4F6; --ink-2:#C9CFD6; --ink-3:#9AA4B0; --ink-4:#7B8592;
    --line:#2A303A; --line-2:#222831; --line-strong:#3A424F;
    --accent:#FF5A78; --accent-btn:#E01542; --accent-btn-hover:#F0295A; --accent-text:#FF8CA0; --accent-soft:#3A1822;
    --tally:#FF6B77; --ok:#4FD99B; --ok-soft:#10301F; --warn:#FFB454; --warn-soft:#3A2A10;
    --sh-card:0 10px 24px -4px rgba(0,0,0,.5),0 2px 6px -1px rgba(0,0,0,.3);
    --sh-panel:0 6px 20px rgba(0,0,0,.4),0 0 0 1px #2A303A;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.55;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:break-word;padding-inline:max(16px,2.4vw);padding-block:12px 56px}
#app{max-width:1280px;margin-inline:auto}
button{font:inherit;color:inherit;cursor:pointer;letter-spacing:inherit}
input,select,textarea{font:inherit;letter-spacing:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:8px 12px;min-width:0;max-width:100%}
input::placeholder,textarea::placeholder{color:var(--ink-4)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
h3{font-size:17px;letter-spacing:-.01em}
p{margin:0}
.muted{color:var(--ink-3);font-size:13.5px;line-height:1.5}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grow{flex:1 1 0;min-width:0}

/* 상단 */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding-block:14px 14px;border-bottom:1px solid var(--line);margin-bottom:20px}
.brand{display:flex;align-items:center;gap:10px;flex:1 1 280px;min-width:0}
.rec{flex:none;width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
#film-title{font-size:clamp(20px,3vw,26px);font-weight:700;letter-spacing:-.025em;border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;padding:2px 2px;width:100%}
#film-title:hover{border-bottom-color:var(--line-strong)}
#film-title:focus-visible{outline:none;border-bottom-color:var(--accent)}
.status{font-size:12px;font-weight:500;color:var(--ink-3);padding:5px 12px;border:1px solid var(--line);border-radius:9999px;background:var(--surface);white-space:nowrap}
.status.ok{color:var(--ok)}
.status.busy{color:var(--warn)}
.status.err{color:var(--tally);border-color:var(--tally)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.tab{background:var(--paper);border:1px solid var(--line-strong);border-radius:9999px;padding:8px 16px;font-size:14px;font-weight:600;color:var(--ink-2)}
.tab:hover{background:var(--hover)}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tab small{margin-left:6px;font-weight:500;opacity:.7}
.banner{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--warn-soft);color:var(--warn);border-radius:var(--r-sm);padding:12px 16px;margin-bottom:16px;font-size:13.5px}

/* 버튼 */
.btn{border:1px solid var(--line-strong);background:var(--paper);border-radius:var(--r-sm);padding:8px 14px;font-size:14px;font-weight:600;color:var(--ink)}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent-btn);color:var(--accent-ink);border-color:var(--accent-btn)}
.btn.primary:hover{background:var(--accent-btn-hover);border-color:var(--accent-btn-hover)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--hover)}
.btn.armed{background:var(--tally);border-color:var(--tally);color:#fff}
.btn.sm{padding:5px 12px;font-size:13px}
.btn.lg{height:52px;width:100%;font-size:16px;border-radius:12px}
.ico{border:1px solid transparent;background:transparent;border-radius:var(--r-xs);width:30px;height:30px;display:inline-grid;place-items:center;color:var(--ink-3);font-size:14px;padding:0}
.ico:hover{background:var(--hover);color:var(--ink)}
.ico.armed{background:var(--tally);color:#fff;border-color:var(--tally);width:auto;padding-inline:10px;font-size:12px}
.btn[disabled],.ico[disabled]{opacity:.4;cursor:default}

/* 카드 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:18px 20px}
.card+.card{margin-top:12px}
.card h3{margin-bottom:10px}
.stack{display:flex;flex-direction:column;gap:12px}
.pill{display:inline-block;font-size:12px;font-weight:500;padding:2px 10px;border-radius:9999px;background:var(--accent-soft);color:var(--accent-text)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.msg{font-size:13px;color:var(--tally);min-height:1em}

/* 대본 */
.script-grid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;align-items:start}
.side{position:sticky;top:12px;display:flex;flex-direction:column;gap:12px}
.side .card+.card{margin-top:0}
.worklines{display:flex;flex-direction:column;gap:6px;font-size:13.5px;margin-bottom:12px}
.btnrow{display:flex;flex-wrap:wrap;gap:6px}
.scene-nav{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:2px;max-height:46vh;overflow:auto}
.sn{width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:var(--r-sm);padding:8px 10px;display:flex;gap:8px;align-items:baseline}
.sn:hover{background:var(--hover)}
.sn.on{background:var(--paper);border-color:var(--line-strong);box-shadow:inset 3px 0 0 var(--accent)}
.sn-no{font-family:var(--font-script);font-size:12.5px;color:var(--ink-3);flex:none}
.sn-name{min-width:0;overflow-wrap:anywhere;font-size:14px}
.paper{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);padding:22px clamp(14px,2.6vw,36px) 26px;box-shadow:var(--sh-card)}
.slug{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--line-strong)}
.slug-no{font-family:var(--font-script);font-weight:700;font-size:16px}
.slug input{font-family:var(--font-script);font-weight:700;border-color:transparent;background:transparent}
.slug input:hover{border-color:var(--line-strong)}
.in-place{flex:1 1 160px}
.in-time{width:110px}
.in-range{width:120px;font-weight:400!important;color:var(--ink-3)}
.slug .tools{margin-left:auto;display:flex}
.blk{display:grid;grid-template-columns:76px minmax(0,1fr);gap:4px 14px;padding:12px 0;border-bottom:1px solid var(--line-2)}
.blk-side{font-size:12px;font-weight:500;color:var(--ink-3);padding-top:8px;display:flex;align-items:flex-start;gap:6px}
.blk-side i{flex:none;width:8px;height:8px;border-radius:50%;margin-top:5px;background:var(--bt,var(--ink-3))}
.blk-main{min-width:0}
.blk-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:2px}
.blk-meta .who{width:110px;font-family:var(--font-script);font-weight:700}
.blk-meta .paren{flex:1 1 120px;font-family:var(--font-script);font-style:italic;color:var(--ink-2)}
.actor{font-size:12px;font-weight:500;color:var(--ok);background:var(--ok-soft);border-radius:9999px;padding:2px 10px;white-space:nowrap}
.actor.none{color:var(--warn);background:var(--warn-soft)}
.blk-tools{margin-left:auto;display:flex;opacity:.4}
.blk:hover .blk-tools,.blk:focus-within .blk-tools{opacity:1}
.blk-text{display:block;width:100%;resize:none;overflow:hidden;border:1px solid transparent;background:transparent;font-family:var(--font-script);font-size:14.5px;line-height:1.8;padding:4px 6px;border-radius:var(--r-xs);word-break:normal;overflow-wrap:anywhere}
.blk-text:hover{border-color:var(--line-strong)}
.t-action .blk-text{font-style:italic;color:var(--ink-2)}
.t-narration .blk-text,.t-caption .blk-text{color:var(--warn)}
.t-sfx .blk-text,.t-music .blk-text{color:var(--ink-2)}
.t-action{--bt:var(--ink-4)}.t-dialogue{--bt:var(--accent)}.t-narration{--bt:var(--warn)}.t-caption{--bt:var(--ok)}.t-sfx{--bt:var(--tally)}.t-music{--bt:var(--tally)}
.addbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-top:16px}
.addbar span{font-size:12.5px;color:var(--ink-3);margin-right:4px}
.panel{margin-bottom:12px}
.panel textarea.mono,.panel textarea.out{width:100%;font-family:var(--font-script);font-size:13px;line-height:1.6;margin-block:8px;word-break:normal}
.vlist{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.vitem{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--paper)}
.vitem b{font-family:var(--font-script)}
.vitem .vnote{flex:1 1 160px;min-width:0;overflow-wrap:anywhere}
.empty{background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--r-md);padding:32px clamp(16px,3vw,36px)}
.empty h2{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-bottom:6px}
.empty .row{margin-top:16px}

/* 사람과 역할 */
.two{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.addperson{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:8px;align-items:end}
.addperson label,.field label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:500;color:var(--ink-3)}
.person{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:18px 20px}
.person-head{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1.5fr) auto;gap:8px;align-items:end}
.person-head .nm{font-weight:600;font-size:16px}
.rlist{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.rchip{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line-strong);border-radius:9999px;padding:2px 4px 2px 12px;background:var(--paper);font-size:13.5px}
.rchip .g{font-size:12px;font-weight:600;color:var(--ink-3);margin-right:6px}
.rchip.g-cast .g{color:var(--accent-text)}
.rchip .ico{width:24px;height:24px;font-size:12px}
.norole{font-size:13px;color:var(--warn);background:var(--warn-soft);padding:3px 12px;border-radius:9999px}
.addrole{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.addrole .r-char{width:150px}
.addrole .r-label{width:150px}
.people{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.charlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.charlist li{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.charlist b{font-family:var(--font-script)}

/* 스토리보드 */
.bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:16px}
.bsec{margin-top:28px}
.bsec-h{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;border-bottom:1px solid var(--line-strong);padding-bottom:8px;margin-bottom:14px}
.bsec-h b{font-size:18px;font-weight:700;letter-spacing:-.02em}
.bsec-h .gist{color:var(--ink-3);font-size:13.5px;flex:1 1 200px;min-width:0;overflow-wrap:anywhere}
.cuts{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.cut{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;display:flex;flex-direction:column;min-width:0;transition:box-shadow .2s}
.cut:hover,.cut:focus-within{box-shadow:var(--sh-card)}
.frame{position:relative;aspect-ratio:16/9;max-width:100%;background:var(--hover);display:grid;place-items:center}
.frame img{width:100%;height:100%;object-fit:cover;display:block}
.frame .ph{font-size:12.5px;color:var(--ink-4)}
.cut-no{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.95);color:#191F28;font-size:12px;font-weight:600;padding:3px 10px;border-radius:9999px;z-index:1;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.frame .imgtools{position:absolute;right:8px;bottom:8px;display:flex;gap:6px;z-index:1}
.imgbtn{position:relative;display:inline-block;background:rgba(255,255,255,.95);color:#191F28;border:1px solid rgba(0,0,0,.08);border-radius:9999px;padding:4px 12px;font-size:12.5px;font-weight:600;cursor:pointer}
.imgbtn:hover{background:#fff}
.imgbtn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.imgbtn input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.cut-body{padding:12px 14px 10px;display:flex;flex-direction:column;gap:8px}
.cut-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cut-row select{flex:1 1 90px;font-size:13px;padding:6px 8px}
.cut-row .sec{width:64px;font-size:13px;padding:6px 8px}
.cut-row label{font-size:12.5px;color:var(--ink-3);display:flex;gap:4px;align-items:center}
.cut-desc{width:100%;resize:none;overflow:hidden;font-size:14px;line-height:1.6;min-height:3.4em}
.cut-tools{display:flex;justify-content:flex-end}

/* 크레딧 */
.credits-grid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;align-items:start}
.opt{display:flex;flex-direction:column;gap:12px;font-size:14px}
.opt label{display:flex;gap:8px;align-items:center}
.screen{background:var(--screen-bg);color:var(--screen-fg);border-radius:var(--r-lg);height:min(74vh,760px);overflow-y:auto;padding:56px clamp(16px,6vw,72px) 96px;scrollbar-width:thin}
.cr-spacer{height:0}
.screen.playing .cr-spacer{height:min(70vh,560px)}
.cr-title{font-size:clamp(28px,5vw,44px);font-weight:700;letter-spacing:-.03em;line-height:1.25;text-wrap:balance}
.cr-sub{color:var(--screen-dim);font-size:14px;margin-top:8px;max-width:46ch}
.cr-group{margin-top:48px;padding-top:16px;border-top:1px solid color-mix(in srgb,var(--screen-fg) 18%,transparent)}
.cr-group>h2{font-size:13px;font-weight:600;letter-spacing:.3em;color:var(--screen-dim);margin-bottom:14px}
.cr-row{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:6px 30px;margin-block:20px}
.cr-label{text-align:right;color:var(--screen-dim);letter-spacing:.14em;font-size:13px;padding-top:6px;overflow-wrap:anywhere}
.cr-entries{display:flex;flex-direction:column;gap:12px;min-width:0}
.cr-name{font-size:clamp(18px,2.6vw,22px);font-weight:700;letter-spacing:-.02em;overflow-wrap:anywhere}
.cr-char{font-size:14px;color:var(--screen-dim);margin-left:8px;font-weight:400}
.cr-meta{font-size:13px;color:var(--screen-dim);overflow-wrap:anywhere}
.cr-quote{font-size:14.5px;color:var(--screen-fg);opacity:.8;margin-top:2px;overflow-wrap:anywhere}
.cr-end{margin-top:64px;color:var(--screen-dim);font-size:13.5px}
.cr-empty{color:var(--screen-dim);padding-block:40px;max-width:40ch}
.cover{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.link{background:none;border:0;padding:0;color:var(--accent-text);text-decoration:underline;font-size:inherit}

/* 대본 만들기 */
.gen-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:24px;align-items:start}
.gen-grid .card+.card{margin-top:0}
#gen-idea{width:100%;min-height:10em;resize:vertical;line-height:1.7;margin-top:8px}
.gen-out{width:100%;min-height:26em;resize:vertical;font-family:var(--font-script);font-size:13px;line-height:1.7;margin-block:8px;word-break:normal}
.opts{display:flex;flex-wrap:wrap;gap:12px;margin:14px 0}
.opts label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:500;color:var(--ink-3)}
.examples{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.examples span{font-size:12.5px;color:var(--ink-3)}
.examples .btn{border-radius:9999px}
.gen-sum{font-size:13.5px;min-height:1.5em}
.hdr-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:12.5px;color:var(--ink-3)}

/* 로그인 */
.auth{min-height:80vh;display:grid;place-items:center;padding-block:24px}
.auth-card{width:100%;max-width:400px;background:var(--paper);border-radius:var(--r-lg);box-shadow:var(--sh-panel);padding:32px 28px}
.auth-logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.02em;margin-bottom:24px}
.auth-card h1{font-size:26px;font-weight:700;letter-spacing:-.025em;margin-bottom:6px}
.auth-card form{display:flex;flex-direction:column;gap:14px;margin-top:20px}
.auth-card label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
.auth-card input{height:48px;font-size:16px;font-weight:400}
.auth-card .msg{min-height:1.4em}
.auth-card code{font-family:var(--font-script);font-size:13px;background:var(--hover);padding:1px 6px;border-radius:var(--r-xs)}

@media (max-width:860px){
  .script-grid,.two,.credits-grid,.gen-grid{grid-template-columns:minmax(0,1fr)}
  .side{position:static}
  .scene-nav{flex-direction:row;flex-wrap:wrap;max-height:none}
  .sn{width:auto;border-color:var(--line)}
  .person-head{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .person-head .quote{grid-column:1/-1}
  .addperson{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .addperson .quote{grid-column:1/-1}
}
@media (max-width:560px){
  .blk{grid-template-columns:minmax(0,1fr)}
  .blk-side{padding-top:0}
  .blk-side i{margin-top:6px}
  .cr-row{grid-template-columns:minmax(0,1fr);gap:2px}

<script>
/* ================= 상수 ================= */
const LS_KEY = 'filmstudio.v1';
const BLOCK_TYPES = {action:'지문', dialogue:'대사', narration:'내레이션', caption:'자막', sfx:'효과음', music:'음악'};
const SHOTS = ['풀샷','미디엄샷','클로즈업','익스트림 클로즈업','오버 더 숄더','투샷','인서트','하이앵글','로우앵글','버드아이'];

const KINDS = {
  cast:[['lead','주연'],['support','조연'],['special','특별 출연'],['voice','목소리 출연'],['extra','단역']],
  crew:[['director','감독'],['writer','각본'],['producer','프로듀서'],['dp','촬영'],['light','조명'],['sound','음향·녹음'],['edit','편집'],['music','음악'],['art','미술·소품'],['costume','의상·분장'],['assist','연출부'],['thanks','도움 주신 분'],['other','기타 (직접 입력)']]
};

/* ================= 유틸 ================= */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const fmtSec = s => Math.floor(s/60) + ':' + pad(Math.round(s%60));

/* ================= 대본 파서 (/edu-video-script 출력 형식) ================= */
/*PARSER-START*/
function blk(type, o){ return Object.assign({id: uid(), type, who:'', paren:'', text:''}, o); }
function parseScript(raw){
  const lines = String(raw).replace(/\r/g,'').split('\n');
  const out = {title:'', logline:'', spec:'', lesson:'', characters:[], memo:'', scenes:[]};
  let sec = 'head', cur = null; const memo = [];
  for (const line of lines){
    const t = line.trim();
    if (!t) continue;
    let m;
    if (/^```/.test(t)) continue;
    if ((m = t.match(/^#\s+(.+)$/))) { out.title = m[1].trim(); continue; }
    if (/^##\s*등장인물/.test(t)) { sec = 'chars'; continue; }
    if (/^##\s*대본/.test(t)) { sec = 'script'; continue; }
    if (/^##\s*제작\s*메모/.test(t)) { sec = 'memo'; continue; }
    if (/^##/.test(t)) { sec = 'other'; continue; }
    if (sec === 'head') {
      if ((m = t.match(/^-\s*로그라인\s*:\s*(.*)$/))) out.logline = m[1];
      else if ((m = t.match(/^-\s*교훈\s*:\s*(.*)$/))) out.lesson = m[1];
      else if ((m = t.match(/^-\s*대상\s*\/\s*길이\s*\/\s*형식\s*:\s*(.*)$/))) out.spec = m[1];
      continue;
    }
    if (sec === 'chars') {
      if ((m = t.match(/^-\s*(.+?)(?:\((.*?)\))?\s*:\s*(.*)$/))) out.characters.push({name:m[1].trim(), age:(m[2]||'').trim(), desc:m[3].trim()});
      continue;
    }
    if (sec === 'memo') { memo.push(t.replace(/^-\s*/, '')); continue; }
    if (sec !== 'script') continue;
    if ((m = t.match(/^S#\s*\d+\s*[.．:]?\s*(.*)$/i))) {
      let rest = m[1], range = '', time = '';
      const r = rest.match(/\[([^\]]*)\]\s*$/);
      if (r) { range = r[1].trim(); rest = rest.slice(0, r.index).trim(); }
      const tm = rest.match(/\(([^)]*)\)\s*$/);
      if (tm) { time = tm[1].trim(); rest = rest.slice(0, tm.index).trim(); }
      cur = {id: uid(), place: rest, time, range, blocks: []};
      out.scenes.push(cur);
      continue;
    }
    if (!cur) continue;
    if (/^\(.*\)$/.test(t)) { cur.blocks.push(blk('action', {text: t.slice(1, -1).trim()})); continue; }
    if ((m = t.match(/^(N|자막|E|M)\s*[:：]\s*(.*)$/))) {
      const type = {N:'narration', '자막':'caption', E:'sfx', M:'music'}[m[1]];
      cur.blocks.push(blk(type, {text: m[2]}));
      continue;
    }
    if ((m = t.match(/^([^:：()]{1,20}?)\s*[:：]\s*(.*)$/))) {
      let text = m[2], paren = '';
      const p = text.match(/^\(([^)]*)\)\s*(.*)$/);
      if (p) { paren = p[1]; text = p[2]; }
      cur.blocks.push(blk('dialogue', {who: m[1].trim(), paren, text}));
      continue;
    }
    cur.blocks.push(blk('action', {text: t.replace(/^\(/, '').replace(/\)$/, '')}));
  }
  out.memo = memo.join('\n');
  return out;
}
/*PARSER-END*/

function loadSample(){

  const c = mk('최민아','가온초등학교','아이들 덕분에 웃으며 찍었어요');
  const d = mk('정우진','프레임 영상동아리','모른다고 말하는 용기, 저도 배웠어요');

  const r = (person, group, kind, character, label) => ({id:uid(), personId:person.id, group, kind, character:character||'', label:label||''});
  S.meta.roles = [
    r(a,'cast','lead','도윤'), r(b,'cast','lead','하린'), r(c,'cast','support','선생님'),
    r(d,'crew','director'), r(d,'crew','writer'), r(e,'crew','dp'), r(e,'crew','edit'), r(f,'crew','sound'), r(f,'crew','music')
  ];
  S.script = {scenes:p.scenes, base:0};
  S.board = {cuts:[]};
  S.board.cuts = generateCuts(S.script.scenes, []);

/* ================= 저장 ================= */
const pending = new Set();
let saveTimer = null, writing = false, lastErr = '';
function setStatus(txt, cls){
  ui.status = [txt, cls || ''];
  const el = $('#status'); if (el){ el.textContent = txt; el.className = 'status ' + (cls || ''); el.title = cls === 'err' ? lastErr : ''; }
}
function touch(name){
  pending.add(name);
  if (S.meta.sample && !ui.persistedSample){ ['meta','script','board'].forEach(n => pending.add(n)); ui.persistedSample = true; }
  setStatus('저장 대기…', 'busy');
  clearTimeout(saveTimer); saveTimer = setTimeout(flush, 700);
  scheduleWork();
}
function payload(n){ return clone(n === 'meta' ? S.meta : n === 'script' ? S.script : S.board); }
function localMirror(){ try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e){} }
async function flush(){
  if (writing) return;
  writing = true;
  let names = [];
  try {
    while (pending.size){
      names = [...pending]; pending.clear();
      setStatus('저장 중…', 'busy');
      if (Store.db){ for (const n of names) await Store.db.doc('film/' + n).set(payload(n)); }
      else localMirror();
      names = [];
    }
    setStatus((Store.db ? '저장됨 · ' : '이 브라우저에 저장됨 · ') + nowLabel(), 'ok');
  } catch(e) {
    names.forEach(n => pending.add(n));
    lastErr = (e && (e.message || e.code)) || '알 수 없는 오류';
    setStatus('저장 실패 · 다시 시도', 'err');
  }
  writing = false;
}
async function loadAll(){
  let found = false;
  if (Store.db){
    try {
      const snap = await Store.db.collection('film').get();
      snap.docs.forEach(d => {
        const x = clone(d.data() || {});
        if (d.id === 'meta'){ S.meta = Object.assign(defMeta(), x); found = true; }
        else if (d.id === 'script'){ S.script = Object.assign({scenes:[], base:0}, x); found = true; }
        else if (d.id === 'board'){ S.board = Object.assign({cuts:[]}, x); found = true; }
      });
      const vs = await Store.db.collection('versions').get();
      S.versions = vs.docs.map(d => clone(d.data())).sort((p, q) => q.n - p.n);
    } catch(e) { throw e; }
  }
  if (!Store.db){
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw){ const x = JSON.parse(raw); S = Object.assign(S, x); S.meta = Object.assign(defMeta(), S.meta); found = true; }
    } catch(e){}
  }
  S.meta.credits = Object.assign({order:'cast-first', org:true, quote:true}, S.meta.credits || {});
  ['characters','people','roles'].forEach(k => { if (!Array.isArray(S.meta[k])) S.meta[k] = []; });
  if (!Array.isArray(S.script.scenes)) S.script.scenes = [];
  if (!Array.isArray(S.board.cuts)) S.board.cuts = [];
  if (!Array.isArray(S.versions)) S.versions = [];
  if (!found) loadSample(); else if (S.meta.sample) ui.persistedSample = true;
  if (!S.script.scenes.find(s => s.id === ui.sceneId)) ui.sceneId = S.script.scenes[0]?.id || null;
  setStatus(Store.db ? '불러옴 · ' + nowLabel() : '이 브라우저에만 저장돼요', Store.db ? 'ok' : '');
}

/* ================= 파생 데이터 ================= */
const curScene = () => S.script.scenes.find(s => s.id === ui.sceneId) || S.script.scenes[0];
const personById = id => S.meta.people.find(p => p.id === id);
function roleLabel(r){
  if (r.kind === 'other') return (r.label || '').trim() || '기타';
  const k = KINDS[r.group].find(x => x[0] === r.kind); return k ? k[1] : r.kind;
}
function allCharacters(){
  const set = new Map();
  S.meta.characters.forEach(c => { if (c.name) set.set(c.name, c); });
  S.script.scenes.forEach(s => s.blocks.forEach(b => { if (b.type === 'dialogue' && b.who && !set.has(b.who.trim())) set.set(b.who.trim(), {name:b.who.trim(), desc:''}); }));
  S.meta.roles.forEach(r => { if (r.group === 'cast' && r.character && !set.has(r.character.trim())) set.set(r.character.trim(), {name:r.character.trim(), desc:''}); });
  return [...set.values()];
}
function actorMap(){
  const m = new Map();
  S.meta.roles.forEach(r => {
    if (r.group !== 'cast' || !r.character) return;
    const p = personById(r.personId); if (!p) return;
    const k = r.character.trim(); if (!m.has(k)) m.set(k, []); m.get(k).push(p.name || '(이름 없음)');
  });
  return m;
}
function spokenChars(){
  let n = 0; S.script.scenes.forEach(s => s.blocks.forEach(b => { if (b.type === 'dialogue' || b.type === 'narration') n += (b.text || '').length; }));
  return n;
}
function baseVersion(){ return S.versions.find(v => v.n === S.script.base); }
function isDirty(){
  const base = baseVersion();
  if (!base) return S.script.scenes.length > 0;
  return JSON.stringify(base.scenes) !== JSON.stringify(S.script.scenes);
}
function buildCredits(){
  const groups = ['cast','crew']; if (S.meta.credits.order === 'crew-first') groups.reverse();
  return groups.map(g => {
    const order = KINDS[g].map(k => k[0]);
    const rs = S.meta.roles.filter(r => r.group === g && personById(r.personId)).slice().sort((a, b) => order.indexOf(a.kind) - order.indexOf(b.kind));
    const rows = [], map = new Map();
    rs.forEach(r => {
      const label = roleLabel(r); let row = map.get(label);
      if (!row){ row = {label, entries:[]}; map.set(label, row); rows.push(row); }
      const p = personById(r.personId);
      row.entries.push({name:p.name || '(이름 없음)', org:p.org, quote:p.quote, character:r.character});
    });
    return {group:g, title:GROUP_LABEL[g], rows};
  }).filter(s => s.rows.length);
}
function creditedIds(){ return new Set(S.meta.roles.filter(r => personById(r.personId)).map(r => r.personId)); }

/* ================= 컷 초안 ================= */
function generateCuts(scenes, existing){
  const have = new Set(existing.map(c => c.sceneId));
  const out = [];
  scenes.forEach(s => {
    if (have.has(s.id)) return;
    const cuts = []; let mode = '';
    const push = (desc, shot, sec) => { const c = {id:uid(), sceneId:s.id, shot, move:'고정', sec, desc, img:''}; cuts.push(c); return c; };
    s.blocks.forEach(b => {
      if (b.type === 'action'){ push(b.text, cuts.length ? '미디엄샷' : '풀샷', 3); mode = 'action'; }
      else if (b.type === 'dialogue'){
        const line = (b.who ? b.who + ': ' : '') + (b.paren ? '(' + b.paren + ') ' : '') + b.text;
        if (mode === 'dialogue' && cuts.length){ const c = cuts[cuts.length-1]; c.desc += '\n' + line; c.shot = '미디엄샷'; c.sec += Math.max(2, Math.round((b.text||'').length / 7)); }
        else { push(line, '클로즈업', Math.max(2, Math.round((b.text||'').length / 7))); mode = 'dialogue'; }
      } else {
        const tag = {narration:'N', caption:'자막', sfx:'효과음', music:'음악'}[b.type];
        const line = tag + ': ' + b.text;
        if (cuts.length){ cuts[cuts.length-1].desc += '\n' + line; } else push(line, '풀샷', 2);
      }
    });
    if (!cuts.length) push('', '풀샷', 3);
    out.push(...cuts);
  });
  return out;
}

/* ================= 크레딧 재생 ================= */
let raf = null, lastT = 0, pos = 0;
function stopPlay(silent){
  ui.playing = false; if (raf) cancelAnimationFrame(raf); raf = null;
  const sc = $('#screen'); if (sc && !silent) sc.classList.remove('playing');
  const b = $('#play-btn'); if (b) b.textContent = '크레딧 재생';
}
function togglePlay(){
  const sc = $('#screen'); if (!sc) return;
  if (ui.playing){ stopPlay(); return; }
  sc.classList.add('playing'); sc.scrollTop = 0; pos = 0; ui.playing = true; lastT = performance.now();
  const b = $('#play-btn'); if (b) b.textContent = '정지';
  raf = requestAnimationFrame(step);
}
function step(t){
  const sc = $('#screen'); if (!sc || !ui.playing){ stopPlay(); return; }
  pos += (t - lastT) / 1000 * CRED_SPEED; lastT = t; sc.scrollTop = pos;
  if (sc.scrollTop + sc.clientHeight >= sc.scrollHeight - 1){ stopPlay(true); const b = $('#play-btn'); if (b) b.textContent = '크레딧 재생'; return; }
  raf = requestAnimationFrame(step);
}

function demote(md){ return md.split('\n').slice(md.startsWith('# ') ? 2 : 0).map(l => /^#{1,5} /.test(l) ? '#' + l : l).join('\n'); }
function mdEsc(s){ return String(s == null ? '' : s).replace(/\|/g, '\\|').replace(/\r?\n/g, '<br>'); }
const HB = '  '; // 마크다운 줄바꿈(끝의 공백 두 칸). 불러올 때는 무시돼요.
function scriptText(){
  const m = S.meta, L = ['# ' + (m.title || '제목 없음'), ''];
  if (m.logline) L.push('- 로그라인: ' + m.logline);
  if (m.spec) L.push('- 대상 / 길이 / 형식: ' + m.spec);
  if (m.lesson) L.push('- 교훈: ' + m.lesson);
  if (m.characters.length){ L.push('', '## 등장인물'); m.characters.forEach(c => L.push('- ' + c.name + (c.age ? '(' + c.age + ')' : '') + ': ' + (c.desc || ''))); }
  L.push('', '## 대본', '');
  S.script.scenes.forEach((s, i) => {
    L.push('S#' + (i+1) + '. ' + s.place + (s.time ? ' (' + s.time + ')' : '') + (s.range ? '  [' + s.range + ']' : ''), '');
    s.blocks.forEach(b => {
      if (b.type === 'action') L.push('(' + b.text + ')', '');
      else if (b.type === 'dialogue') L.push((b.who || '') + ': ' + (b.paren ? '(' + b.paren + ') ' : '') + b.text + HB);
      else L.push({narration:'N', caption:'자막', sfx:'E', music:'M'}[b.type] + ': ' + b.text + HB);
    });
    L.push('');
  });
  if (m.memo){ L.push('## 제작 메모'); m.memo.split('\n').forEach(x => L.push('- ' + x)); }
  return L.join('\n').replace(/\n{3,}/g, '\n\n').trimEnd() + '\n';
}
function boardText(){
  const m = S.meta, cuts = S.board.cuts, L = ['# ' + (m.title || '제목 없음') + ' — 스토리보드', ''];
  if (m.logline) L.push('> ' + m.logline, '');
  L.push('- 씬 ' + S.script.scenes.length + '개 · 컷 ' + cuts.length + '개 · 예상 길이 ' + fmtSec(boardTotal()), '');
  let anyImg = false;
  S.script.scenes.forEach((s, i) => {
    const cs = cutsOf(s.id);
    L.push('## S#' + (i+1) + '. ' + (s.place || '장소 미정') + (s.time ? ' (' + s.time + ')' : '') + (s.range ? '  [' + s.range + ']' : ''), '');
    if (!cs.length){ L.push('_컷이 아직 없어요._', ''); return; }
    L.push('| 컷 | 샷 | 카메라 | 길이 | 화면 설명 | 이미지 |', '|---|---|---|---|---|---|');
    cs.forEach((c, j) => { if (c.img) anyImg = true; L.push('| C' + (i+1) + '-' + (j+1) + ' | ' + mdEsc(c.shot) + ' | ' + mdEsc(c.move) + ' | ' + (+c.sec || 0) + '초 | ' + mdEsc(c.desc) + ' | ' + (c.img ? '있음' : '-') + ' |'); });

  return L.join('\n').trimEnd() + '\n';

function rosterRows(){

function arm(btn){

function swap(arr, a, b){ const t = arr[a]; arr[a] = arr[b]; arr[b] = t; }

function removeCuts(filter){

async function saveVersion(note){
  const n = S.versions.reduce((m, v) => Math.max(m, v.n), 0) + 1;
  const v = {n, note: note || '', savedAt: new Date().toISOString(), scenes: clone(S.script.scenes)};
  if (Store.db) await Store.db.doc('versions/v' + n).set(v);
  S.versions.unshift(v); S.script.base = n;

async function importScript(src){
  const fromGen = src === 'gen';
  const raw = fromGen ? ui.gen.out : (($('#imp-text') || {}).value || '');
  const msg = fromGen ? $('#gen-msg') : $('#imp-msg');
  const mode = ($(fromGen ? 'input[name="gen-mode"]:checked' : 'input[name="imp-mode"]:checked') || {}).value || 'replace';
  const p = parseScript(raw);
  if (!p.scenes.length){ if (msg) msg.textContent = 'S#1. 장소 (시간) 형식의 씬 제목을 찾지 못했어요. 대본 부분까지 함께 붙여넣었는지 확인해 주세요.'; return; }
  try {
    if (mode === 'replace'){
      if (S.script.scenes.length && isDirty()) await saveVersion('불러오기 전 자동 저장');
      removeCuts(() => true);
      S.script.scenes = p.scenes; S.script.base = 0;
      Object.assign(S.meta, {title:p.title || S.meta.title, logline:p.logline, lesson:p.lesson, spec:p.spec, memo:p.memo, characters:p.characters, sample:false});
    } else {
      S.script.scenes = S.script.scenes.concat(p.scenes);
      const known = new Set(S.meta.characters.map(c => c.name));
      p.characters.forEach(c => { if (!known.has(c.name)) S.meta.characters.push(c); });
      if (!S.meta.title) S.meta.title = p.title;
      S.meta.sample = false;
    }
  } catch(e){ if (msg) msg.textContent = '자동 저장에 실패해서 멈췄어요. 잠시 뒤 다시 시도해 주세요.'; return; }
  ui.sceneId = S.script.scenes[mode === 'append' ? S.script.scenes.length - p.scenes.length : 0].id;
  ui.panel = ''; ['meta','script','board'].forEach(touch);
  if (fromGen){ ui.tab = 'script'; try { localStorage.setItem('filmstudio.tab', 'script'); } catch(e){} }
  render();
}

  removeCuts(() => true);
  if (Store.db){ for (const v of S.versions){ try { await Store.db.doc('versions/v' + v.n).delete(); } catch(e){} } }
  S.meta = defMeta(); S.script = {scenes:[], base:0}; S.board = {cuts:[]}; S.versions = []; ui.sceneId = null; ui.panel = 'import'; ui.persistedSample = false;

}
async function uploadImage(file, cid){
  const c = S.board.cuts.find(x => x.id === cid); if (!c || !Store.assets) return;
  ui.boardMsg = '이미지 올리는 중…'; const m = $('.msg[role="status"]'); if (m) m.textContent = ui.boardMsg;
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 1280 / Math.max(bmp.width, bmp.height));
    const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
    cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
    const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.82));
    const res = await Store.assets.upload(blob);
    if (c.img) Store.assets.delete(c.img).catch(() => {});
    c.img = res.id; touch('board'); ui.boardMsg = '';
  } catch(e){ ui.boardMsg = '이미지를 올리지 못했어요. 다른 파일(JPG, PNG)로 다시 시도해 주세요.'; }
  render();
}

  const who = [...new Set(p.characters.map(c => c.name))].join(', ');
  return `<span class="pill ok">씬 ${p.scenes.length}개</span> 대사·내레이션 ${n}자${who ? ' · 인물 ' + esc(who) : ''}`;
}

async function genStart(){
  const g = ui.gen;
  if (g.busy || g.blocked) return;
  const idea = (g.idea || '').trim();
  if (!idea){ g.msg = '만들고 싶은 이야기를 먼저 적어 주세요.'; syncGen(); const t = $('#gen-idea'); if (t) t.focus(); return; }
  if (!Store.sample) return;
  const input = {idea, len: g.len, aud: g.aud};
  genCtl = new AbortController();
  g.busy = true; g.out = ''; g.msg = 'Claude가 이야기를 구상하는 중이에요. 30초에서 1분쯤 걸려요.';
  render();
  try {
    const res = await Store.sample(input, {signal: genCtl.signal, cache: false, onText: ({text}) => { g.out = text; g.msg = '대본을 쓰는 중이에요…'; syncGen(); }});
    g.out = res.text;
    g.msg = res.truncated ? '길이 제한에 걸려 끝이 잘렸을 수 있어요. 길이를 줄여 다시 만들어 보세요.' : '완성됐어요. 읽어 보고 고친 뒤 대본 탭으로 가져오세요.';
  } catch(e){
    if (e && e.text) g.out = e.text;
    g.msg = genErrText(e) + (e && e.detail ? ' (' + e.detail + ')' : '') + (e && e.text && e.code !== 'cancelled' ? ' 받은 데까지는 남겨 두었어요.' : '');
    if (e && ['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(e.code)) g.blocked = true;
  }
  g.busy = false; genCtl = null; saveGenDraft(); render();
}

document.addEventListener('input', e => {
  const t = e.target;
  if (!t.dataset) return;
  if (t.dataset.gen){ ui.gen[t.dataset.gen] = t.value; if (t.dataset.gen === 'out') syncGenSummary(); saveGenDraft(); return; }
  if (t.dataset.mf){ S.meta[t.dataset.mf] = t.value; touch('meta'); return; }
  if (t.dataset.sf){ const s = curScene(); if (!s) return; s[t.dataset.sf] = t.value; touch('script'); const nav = $('.sn.on .sn-name'); if (nav) nav.textContent = (s.place || '장소 미정') + (s.time ? ' · ' + s.time : ''); return; }
  if (t.dataset.f){ const row = t.closest('.blk'); const b = row && findBlock(row.dataset.bid); if (!b) return; b[t.dataset.f] = t.value; if (t.tagName === 'TEXTAREA') grow(t); touch('script'); return; }
  if (t.dataset.pf){ const p = personById(t.closest('.person').dataset.pid); if (!p) return; p[t.dataset.pf] = t.value; touch('meta'); return; }
  if (t.dataset.cf){
    const c = S.board.cuts.find(x => x.id === t.closest('.cut').dataset.cid); if (!c) return;
    c[t.dataset.cf] = t.dataset.cf === 'sec' ? Math.max(0, +t.value || 0) : t.value;

async function act(name, el){
  const sceneIdx = () => S.script.scenes.findIndex(s => s.id === ui.sceneId);
  switch (name){
    case 'logout': sb.auth.signOut().finally(() => location.reload()); break;
    case 'retry-load': openWorkspace(); break;
    case 'tab': ui.tab = el.dataset.tab; ui.panel = ''; try { localStorage.setItem('filmstudio.tab', ui.tab); } catch(e){} render(); break;
    case 'panel': ui.panel = el.dataset.panel; render(); if (ui.panel === 'import') { const t = $('#imp-text'); if (t) t.focus(); } else if (ui.panel === 'save') { const t = $('#ver-note'); if (t) t.focus(); } break;
    case 'scene-select': ui.sceneId = el.dataset.sid; render(); break;
    case 'scene-add': { const s = {id:uid(), place:'', time:'', range:'', blocks:[blk('action', {text:''})]}; S.script.scenes.push(s); ui.sceneId = s.id; ui.tab = 'script'; ui.focus = '.in-place'; touch('script'); render(); break; }
    case 'scene-up': { const i = sceneIdx(); if (i > 0){ swap(S.script.scenes, i, i-1); touch('script'); render(); } break; }
    case 'scene-down': { const i = sceneIdx(); if (i > -1 && i < S.script.scenes.length - 1){ swap(S.script.scenes, i, i+1); touch('script'); render(); } break; }
    case 'scene-del': { const i = sceneIdx(); if (i < 0) break; const id = S.script.scenes[i].id; S.script.scenes.splice(i, 1); removeCuts(c => c.sceneId === id); ui.sceneId = (S.script.scenes[i] || S.script.scenes[i-1] || {}).id || null; touch('script'); touch('board'); render(); break; }
    case 'blk-add': { const s = curScene(); if (!s) break; const b = blk(el.dataset.type); s.blocks.push(b); ui.focus = `.blk[data-bid="${b.id}"] ${el.dataset.type === 'dialogue' ? '.who' : '.blk-text'}`; touch('script'); render(); break; }
    case 'blk-up': case 'blk-down': { const s = curScene(), id = el.closest('.blk').dataset.bid; if (!s) break; const i = s.blocks.findIndex(b => b.id === id), j = name === 'blk-up' ? i - 1 : i + 1; if (j < 0 || j >= s.blocks.length) break; swap(s.blocks, i, j); ui.focus = `.blk[data-bid="${id}"] .blk-text`; touch('script'); render(); break; }
    case 'blk-del': { const s = curScene(), id = el.closest('.blk').dataset.bid; if (!s) break; s.blocks = s.blocks.filter(b => b.id !== id); touch('script'); render(); break; }
    case 'do-save-version': {
      const note = ($('#ver-note') || {}).value || '', msg = $('#ver-msg');
      if (!S.script.scenes.length){ if (msg) msg.textContent = '저장할 대본이 아직 없어요.'; break; }
      try { await saveVersion(note.trim()); ui.panel = 'versions'; render(); } catch(e){ if (msg) msg.textContent = '버전을 저장하지 못했어요. 대본이 너무 크거나 저장소에 문제가 있어요.'; }
      break;
    }
    case 'restore': {
      const v = S.versions.find(x => x.n === +el.dataset.n); if (!v) break;
      try { if (isDirty() && S.script.scenes.length) await saveVersion('복원 전 자동 저장'); } catch(e){ break; }
      S.script.scenes = clone(v.scenes); S.script.base = v.n;
      const have = new Set(S.script.scenes.map(s => s.id)); removeCuts(c => !have.has(c.sceneId));
      ui.sceneId = S.script.scenes[0]?.id || null; ui.panel = ''; touch('script'); touch('board'); render(); break;
    }
    case 'do-import': importScript(); break;
    case 'gen-import': importScript('gen'); break;
    case 'gen-start': genStart(); break;
    case 'gen-stop': if (genCtl) genCtl.abort(); break;
    case 'gen-example': ui.gen.idea = GEN_EXAMPLES[+el.dataset.i] || ''; saveGenDraft(); ui.focus = '#gen-idea'; render(); break;
    case 'gen-copy': { const ta = $('#gen-out'); if (!ta) break; try { await navigator.clipboard.writeText(ta.value); el.textContent = '복사했어요'; } catch(e){ ta.focus(); ta.select(); } break; }
    case 'export-script': exportFile(safeName(S.meta.title) + '-대본' + (S.script.base ? '-v' + S.script.base : '') + '.md', scriptText(), '대본 (.md)'); break;
    case 'export-board': exportFile(safeName(S.meta.title) + '-스토리보드.md', boardText(), '스토리보드 (.md)'); break;
    case 'export-credits': exportFile(safeName(S.meta.title) + '-엔딩크레딧.md', creditsText(), '엔딩 크레딧 (.md)'); break;
    case 'export-roster': exportFile(safeName(S.meta.title) + '-출연제작진명단.md', rosterText(), '출연·제작진 명단 (.md)'); break;
    case 'export-all': exportFile(safeName(S.meta.title) + '-제작노트.md', fullText(), '전체 제작 노트 (.md)'); break;
    case 'gen-save': { const p = parseScript(ui.gen.out); exportFile(safeName(p.title || (ui.gen.idea || '').slice(0, 20) || '생성 대본') + '-생성대본.md', ui.gen.out.trimEnd() + '\n', '생성한 대본 (.md)'); break; }
    case 'copy-export': { const ta = $('#export-out'), msg = $('#exp-msg'); try { await navigator.clipboard.writeText(ta.value); if (msg) msg.textContent = ''; el.textContent = '복사했어요'; } catch(e){ ta.focus(); ta.select(); if (msg) msg.textContent = '자동 복사가 막혀 있어요. 선택된 텍스트를 직접 복사해 주세요.'; } break; }
    case 'person-add': {
      const n = $('#np-name'), o = $('#np-org'), q = $('#np-quote');
      if (!n.value.trim()){ n.focus(); break; }
      const p = {id:uid(), name:n.value.trim(), org:o.value.trim(), quote:q.value.trim()};
      S.meta.people.push(p); ui.focus = `.person[data-pid="${p.id}"] .r-kind`; touch('meta'); render(); break;
    }
    case 'person-del': { const id = el.closest('.person').dataset.pid; S.meta.people = S.meta.people.filter(p => p.id !== id); S.meta.roles = S.meta.roles.filter(r => r.personId !== id); touch('meta'); render(); break; }
    case 'role-add': {
      const card = el.closest('.person'), row = el.closest('.addrole'); if (!card) break;
      const group = $('.r-group', row).value, kind = $('.r-kind', row).value;
      const r = {id:uid(), personId:card.dataset.pid, group, kind, character: group === 'cast' ? $('.r-char', row).value.trim() : '', label: kind === 'other' ? $('.r-label', row).value.trim() : ''};
      if (kind === 'other' && !r.label){ $('.r-label', row).focus(); break; }
      S.meta.roles.push(r); ui.focus = `.person[data-pid="${card.dataset.pid}"] .r-kind`; touch('meta'); render(); break;
    }
    case 'role-del': { const id = el.closest('.rchip').dataset.rid; S.meta.roles = S.meta.roles.filter(r => r.id !== id); touch('meta'); render(); break; }
    case 'role-up': case 'role-down': {
      const id = el.closest('.rchip').dataset.rid, a = S.meta.roles, i = a.findIndex(r => r.id === id), me = a[i], dir = name === 'role-up' ? -1 : 1;
      const same = r => r.group === me.group && roleLabel(r) === roleLabel(me);
      let j = i + dir; while (j >= 0 && j < a.length && !same(a[j])) j += dir;
      if (j >= 0 && j < a.length){ swap(a, i, j); touch('meta'); render(); } break;
    }
    case 'cuts-generate': {
      const add = generateCuts(S.script.scenes, S.board.cuts); S.board.cuts = S.board.cuts.concat(add);
      ui.boardMsg = add.length + '개의 컷 초안을 만들었어요. 샷 크기와 설명을 다듬어 보세요.'; touch('board'); render(); break;
    }
    case 'cut-add': { const c = {id:uid(), sceneId:el.dataset.sid, shot:'미디엄샷', move:'고정', sec:3, desc:'', img:''}; S.board.cuts.push(c); ui.focus = `.cut[data-cid="${c.id}"] .cut-desc`; touch('board'); render(); break; }
    case 'cut-up': case 'cut-down': {
      const id = el.closest('.cut').dataset.cid, c = S.board.cuts.find(x => x.id === id); if (!c) break;
      const a = S.board.cuts, i = a.indexOf(c), dir = name === 'cut-up' ? -1 : 1;
      let j = i + dir; while (j >= 0 && j < a.length && a[j].sceneId !== c.sceneId) j += dir;
      if (j >= 0 && j < a.length){ swap(a, i, j); touch('board'); render(); } break;
    }
    case 'cut-del': { const id = el.closest('.cut').dataset.cid; removeCuts(c => c.id === id); touch('board'); render(); break; }
    case 'cut-img-del': { const c = S.board.cuts.find(x => x.id === el.closest('.cut').dataset.cid); if (c && c.img){ if (Store.assets) Store.assets.delete(c.img).catch(() => {}); c.img = ''; touch('board'); render(); } break; }
    case 'credits-play': togglePlay(); break;
    case 'reset-all': resetAll(); break;
  }
}

  <form id="login-form" novalidate>
    <label>이메일<input id="login-email" type="email" autocomplete="username" inputmode="email" required></label>
    <label>비밀번호<input id="login-pw" type="password" autocomplete="current-password" required></label>
    <p id="login-msg" class="msg" role="alert">${esc(ui.authMsg)}</p>
    <button class="btn primary lg" type="submit">로그인</button>
  </form>`);
}
function loginErrText(e){
  const m = String((e && e.message) || '').toLowerCase();
  if (m.includes('invalid login')) return '이메일 또는 비밀번호가 맞지 않아요.';
  if (m.includes('rate') || e && e.status === 429) return '시도가 너무 많아요. 잠시 뒤 다시 해 주세요.';
  if (m.includes('failed to fetch') || m.includes('network')) return '네트워크에 연결하지 못했어요.';
  return '로그인하지 못했어요. 잠시 뒤 다시 해 주세요.';
}
document.addEventListener('submit', async e => {
  if (!e.target || e.target.id !== 'login-form') return;
  e.preventDefault();
  const email = $('#login-email').value.trim(), pw = $('#login-pw').value;
  const msg = $('#login-msg'), btn = e.target.querySelector('button[type="submit"]');
  if (!email || !pw){ msg.textContent = '이메일과 비밀번호를 입력해 주세요.'; return; }
  btn.disabled = true; msg.textContent = '로그인 중…';
  try {
    const r = await sb.auth.signInWithPassword({email, password: pw});
    if (r.error) throw r.error;
    session = r.data.session;
    await openWorkspace();
  } catch(err){
    ui.authMsg = loginErrText(err);
    if (ui.auth !== 'in'){ msg.textContent = ui.authMsg; btn.disabled = false; const p = $('#login-pw'); if (p){ p.value = ''; p.focus(); } }
  }
});

/* Supabase를 기존 저장소 인터페이스(db / assets / sample)에 맞춰 연결한다 */
function makeDb(){
  const uid = session.user.id;
  const T = () => sb.from('docs');
  const chk = r => { if (r.error){ const e = new Error(r.error.message || '저장소 오류'); e.code = r.error.code; throw e; } return r; };
  return {
    doc: path => ({
      set: async data => { chk(await T().upsert({user_id: uid, path, data, updated_at: new Date().toISOString()}, {onConflict: 'user_id,path'})); },
      delete: async () => { chk(await T().delete().eq('user_id', uid).eq('path', path)); }
    }),
    collection: name => ({
      get: async () => {
        const r = chk(await T().select('path,data').like('path', name + '/%'));
        return {docs: (r.data || []).map(x => ({id: x.path.slice(name.length + 1), data: () => x.data}))};
      }
    })
  };
}
const BUCKET = 'cuts';
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
const Img = {
  map: new Map(), busy: new Set(), timer: 0,
  src(id){ const e = this.map.get(id); if (e && e.exp > Date.now()) return e.url; this.load([id]); return ''; },
  async load(ids){
    const need = ids.filter(i => i && !this.busy.has(i)); if (!need.length || !sb) return;
    need.forEach(i => this.busy.add(i));
    let got = 0;
    try {
      const r = await sb.storage.from(BUCKET).createSignedUrls(need, 21600);
      (r.data || []).forEach(x => {
        if (x && x.signedUrl){ this.map.set(x.path, {url: x.signedUrl, exp: Date.now() + 20 * 60 * 1000 * 15}); got++; }
        else if (x && x.path) this.map.set(x.path, {url: '', exp: Date.now() + 60000});
      });
    } catch(e){ need.forEach(i => this.map.set(i, {url: '', exp: Date.now() + 60000})); }
    need.forEach(i => this.busy.delete(i));
    if (got && !this.timer) this.timer = setTimeout(() => { this.timer = 0; if (ui.auth === 'in' && ui.loaded) render(); }, 80);
  },
  prefetch(){ return this.load(S.board.cuts.map(c => c.img).filter(Boolean)); },
  drop(id){ this.map.delete(id); }
};
function makeAssets(){
  const uid = session.user.id;
  return {
    upload: async blob => {
      const id = uid + '/' + uuid() + '.jpg';
      const r = await sb.storage.from(BUCKET).upload(id, blob, {contentType: 'image/jpeg', upsert: false, cacheControl: '3600'});
      if (r.error) throw new Error(r.error.message);
      await Img.load([id]);
      return {id};
    },
    delete: async id => { Img.drop(id); const r = await sb.storage.from(BUCKET).remove([id]); if (r.error) throw new Error(r.error.message); }
  };
}
/* 대본 생성: 서버 함수(/api/generate)가 스킬 규칙과 함께 Claude를 호출한다. 줄 단위 JSON을 읽어 글자를 이어 붙인다. */
function makeSample(){
  return async (input, opts) => {
    opts = opts || {};
    const sess = (await sb.auth.getSession()).data.session;
    if (!sess) throw {code: 'session_expired'};
    let resp;
    try {
      resp = await fetch('/api/generate', {method: 'POST', headers: {'content-type': 'application/json', authorization: 'Bearer ' + sess.access_token}, body: JSON.stringify(input), signal: opts.signal});
    } catch(e){ throw {code: e && e.name === 'AbortError' ? 'cancelled' : 'network', text: ''}; }
    if (!resp.ok){
      let code = 'upstream_error', detail = '';
      try { const j = await resp.json(); code = j.code || code; detail = j.detail || ''; }
      catch(e){ detail = resp.status === 404 ? '서버 함수(api/generate.js)를 찾지 못했어요. 배포를 확인해 주세요.' : '서버 응답 ' + resp.status; }
      throw {code, detail, status: resp.status};
    }
    const rd = resp.body.getReader(), dec = new TextDecoder();
    let buf = '', text = '', truncated = false;
    try {
      for (;;){
        const {done, value} = await rd.read(); if (done) break;
        buf += dec.decode(value, {stream: true});
        let i;
        while ((i = buf.indexOf('\n')) >= 0){
          const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1); if (!line) continue;
          let m; try { m = JSON.parse(line); } catch(e){ continue; }
          if (m.t === 'd'){ text += m.x; if (opts.onText) opts.onText({text}); }
          else if (m.t === 'e'){ throw {code: m.code, text}; }
          else if (m.t === 'done'){ truncated = !!m.truncated; }
        }
      }
    } catch(e){
      if (e && e.name === 'AbortError') throw {code: 'cancelled', text};
      if (e && e.code) throw e;
      throw {code: 'network', text};
    }
    if (!text.trim()) throw {code: 'empty_completion'};
    return {text, truncated};
  };
}

async function openWorkspace(){
  ui.auth = 'in'; ui.loaded = false; ui.loadErr = ''; render();
  Store.db = makeDb(); Store.assets = makeAssets(); Store.sample = makeSample(); Store.downloads = null;
  try { await loadAll(); Img.prefetch(); }
  catch(e){ ui.loadErr = (e && e.message) || '알 수 없는 오류'; render(); return; }
  ui.loaded = true; render();
}
async function startAuth(){
  render();
  if (!configured()){ ui.auth = 'setup'; render(); return; }
  if (!window.supabase){ ui.auth = 'nolib'; render(); return; }
  sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, {auth: {persistSession: true, autoRefreshToken: true}});
  sb.auth.onAuthStateChange((ev, s) => { session = s; if (ev === 'SIGNED_OUT' && ui.auth === 'in') location.reload(); });
  try { session = (await sb.auth.getSession()).data.session; } catch(e){ session = null; }
  if (session) await openWorkspace(); else { ui.auth = 'login'; render(); }
}

startAuth();
